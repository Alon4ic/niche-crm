services:
  postgres:
    image: postgres:18-alpine
    container_name: niche_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: niche_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d niche_crm"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  # Redis понадобится для realtime (Hocuspocus pub/sub) при нескольких экземплярах, сейчас не используется
  # redis:
  #   image: redis:7-alpine
  #   container_name: niche_crm_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  postgres_data:
  redis_data:
