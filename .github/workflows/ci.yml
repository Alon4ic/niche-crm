name: CI
 
on:
  push:
    branches: [main]
  pull_request:
 
jobs:
  backend:
    name: "Backend: типы и e2e-тесты"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
 
    # Отдельный Postgres только для этого прогона
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: niche_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_user -d niche_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
 
    # Переменные окружения для тестов. Если env.validation.ts требует другие,
    # добавьте их сюда по образцу вашего .env.test.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_user:ci_password@localhost:5432/niche_crm_test?schema=public
      JWT_ACCESS_SECRET: ci-test-secret-ci-test-secret-ci-test-1234
      CORS_ORIGINS: http://localhost:5173
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
 
      - name: Установка зависимостей
        run: npm ci
 
      - name: Генерация Prisma Client
        run: npx prisma generate
 
      - name: Проверка типов приложения
        run: npx tsc --noEmit -p tsconfig.json
 
      - name: Проверка типов тестов
        run: npx tsc --noEmit -p test/tsconfig.json
 
      - name: E2E-тесты
        run: npm run test:e2e
 
  frontend:
    name: "Frontend: типы и сборка"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
 
      - name: Установка зависимостей
        run: npm ci
 
      # Обычно "build" в Vite-проекте уже включает проверку типов (tsc -b && vite build).
      # Если у вас иначе, замените на npx tsc --noEmit
      - name: Сборка и проверка типов
        run: npm run build
 